<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  fontconfig configuration for the macOS install (etc/fonts/fonts.conf).
  The launcher points FONTCONFIG_FILE here so that the bundled fontconfig
  never reads the configuration of the package manager it was built with.
  Font directories are the macOS ones. conf.d holds fontconfig's standard
  rules (generic family aliases, hinting), copied in by build.sh, so font
  choices match a stock fontconfig. The cache goes where fontconfig puts a
  per-user cache by default.
-->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/System/Library/AssetsV2/com_apple_MobileAsset_Font8</dir>
  <dir prefix="xdg">fonts</dir>
  <include ignore_missing="yes">conf.d</include>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
